      <rect x="30" y="44" width="46" height="30" rx="5" fill="#FFFFFF"/>
      <circle cx="71" cy="41" r="11.5" fill="#000000"/>
      <circle cx="71" cy="41" r="9.5" fill="#FFFFFF"/>
      <rect x="69.6" y="35.5" width="2.8" height="11" rx="1.4" fill="#000000"/>
      <rect x="65.5" y="39.6" width="11" height="2.8" rx="1.4" fill="#000000"/>
    </mask>
  </defs>
  <rect width="108" height="108" fill="#000000" mask="url(#shape)"/>
</svg>
